name: 最新動画を自動反映

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 日本時間 朝6時ごろ
  workflow_dispatch: {} # 手動実行ボタン

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSSから最新動画リストを生成
        run: python3 scripts/update_videos.py

      - name: 変更があればコミット(同じ内容なら何もしない)
        run: |
          git config user.name "wakapanda-bot"
          git config user.email "wakapanda-bot@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || git commit -m "自動更新: 最新動画リスト"
          git push
