name: 最新動画を自動反映

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 日本時間 朝6時ごろ
  workflow_dispatch: {} # 手動実行ボタン

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSSから最新動画リストを生成
        run: python3 scripts/update_videos.py

      - name: 新しい動画を全動画リストに足して、アルバムなどを作り直す
        id: archive
        continue-on-error: true # ここで失敗しても、上の最新動画リストはコミットする
        run: python3 scripts/update_archive.py

      - name: 変更があればコミット(同じ内容なら何もしない)
        run: |
          git config user.name "wakapanda-bot"
          git config user.email "wakapanda-bot@users.noreply.github.com"
          git add data/videos.json data/archive.json data/source panda fuuhin-monogatari.html kinenbi-calendar.html meiba-shu.html
          git diff --cached --quiet || git commit -m "自動更新: 最新動画リストとアルバム"
          git push

      - name: アルバムの作り直しが失敗していたら、赤い×にして知らせる(GitHubからメールが届く)
        if: steps.archive.outcome == 'failure'
        run: |
          echo "update_archive.py が失敗しました。翌朝の実行で自動で作り直されます(CSVとアルバムのずれを見て直す作り)"
          exit 1
